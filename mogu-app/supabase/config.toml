
[functions.places-search]
enabled = true
verify_jwt = false
import_map = "./functions/places-search/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/places-search/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/places-search/*.html" ]

[functions.place-photo]
enabled = true
verify_jwt = false
import_map = "./functions/place-photo/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/place-photo/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/place-photo/*.html" ]

[functions.delete-account]
enabled = true
# 関数の内部でJWTを検証しているため verify_jwt は false にしているが、
# ゲスト以外は必ずAuthorizationヘッダーを付けて呼ぶこと。
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
entrypoint = "./functions/delete-account/index.ts"
