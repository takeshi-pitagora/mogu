<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>パスワードの再設定 | mogu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* アプリの確定デザイン（§3 の色・文字・入力欄・ボタン）に合わせたページ */
  :root { --bg:#FFFFFF; --surface:#EFEBE4; --ink:#2E2C2A; --sub:#6B6560; --line:#E3DED6; --line-strong:#D3CCC2; --red:#C62828; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 56px 20px 60px; }
  .logo { display: block; width: 127px; height: 44px; object-fit: contain; margin: 0 auto; }
  h1 { margin: 28px 0 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px; text-align: center; }
  p { margin: 8px 0 0; font-size: 14px; line-height: 1.7; }
  label { display: block; margin: 24px 0 6px; font-size: 13px; font-weight: 700; }
  .field { display: flex; align-items: center; height: 56px; padding: 0 10px 0 18px; border: 2px solid var(--ink); border-radius: 18px; }
  .field:focus-within { box-shadow: inset 0 0 0 1px var(--ink); }
  .field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--ink); }
  .eye { width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: var(--sub); display: flex; align-items: center; justify-content: center; }
  ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; font-weight: 700; }
  li { display: flex; align-items: center; gap: 6px; height: 24px; color: var(--sub); }
  li.ok { color: var(--ink); }
  li svg { flex: none; color: var(--line-strong); }
  li.ok svg { color: var(--ink); }
  .btn { display: block; width: 100%; height: 56px; margin-top: 24px; border: 0; border-radius: 28px; background: var(--ink); color: #fff; font: inherit; font-size: 16px; font-weight: 700; }
  .btn:disabled { background: var(--surface); color: var(--sub); }
  .error { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--red); }
  .done { text-align: center; padding-top: 40px; }
  .circle { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="mogu_logo_black.png" alt="mogu">

  <!-- 読み込み中 -->
  <section id="loading"><h1>パスワードの再設定</h1><p style="text-align:center;color:var(--sub)">読み込んでいます</p></section>

  <!-- 新しいパスワード -->
  <form id="form" hidden novalidate>
    <h1>パスワードの再設定</h1>
    <p>新しいパスワードを入れてください</p>
    <label for="pw">新しいパスワード</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="button" class="eye" id="eye" aria-label="パスワードを見せる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linejoin="miter" stroke-linecap="square" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0zM4 4l16 16"/></svg></button>
    </div>
    <ul aria-label="パスワードの条件">
      <li id="r1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="square"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>8文字以上</li>
      <li id="r2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="square"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>英字と数字を含む</li>
    </ul>
    <div class="error" id="err" role="alert"></div>
    <button class="btn" id="submit" type="submit" disabled>パスワードを変更する</button>
  </form>

  <!-- 変更できた -->
  <section id="done" class="done" hidden>
    <h1>パスワードを変更しました</h1>
    <p>アプリに戻って、新しいパスワードでログインしてください</p>
  </section>

  <!-- リンクが使えない -->
  <section id="expired" class="done" hidden>
    <h1>リンクの期限が切れています</h1>
    <p>アプリの「パスワードを忘れた方」から、もう一度メールを送ってください</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Supabase のプロジェクトのURLと公開キー（anon key。アプリにも入っている公開してよいキー）
  const SUPABASE_URL = 'https://azcwpopmxavqxpvdjglf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jzxIJb-cVz9mE5Anvz46PQ_n_ItpZdQ';

  const $ = (id) => document.getElementById(id);
  const EYE_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linejoin="miter" stroke-linecap="square" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0z"/></svg>';
  const OFF_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linejoin="miter" stroke-linecap="square" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0zM4 4l16 16"/></svg>';
  const show = (id) => ['loading', 'form', 'done', 'expired'].forEach((k) => ($(k).hidden = k !== id));
  const rules = (v) => [v.length >= 8, /[A-Za-z]/.test(v) && /[0-9]/.test(v)];

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
    show('expired');
  } else {
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: false } });
    let ready = false;
    client.auth.onAuthStateChange((event, session) => {
      if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session && !ready) {
        ready = true;
        show('form');
      }
    });
    // リンクにエラーが付いている（期限切れなど）か、数秒たってもログインできなければ「期限切れ」
    if (/error=/.test(location.hash + location.search)) show('expired');
    setTimeout(() => { if (!ready) show('expired'); }, 6000);

    const pw = $('pw');
    pw.addEventListener('input', () => {
      const [a, b] = rules(pw.value);
      $('r1').classList.toggle('ok', a);
      $('r2').classList.toggle('ok', b);
      $('submit').disabled = !(a && b);
      $('err').textContent = '';
    });
    $('eye').addEventListener('click', () => {
      const hidden = pw.type === 'password';
      pw.type = hidden ? 'text' : 'password';
      $('eye').innerHTML = hidden ? EYE_SVG : OFF_SVG;
      $('eye').setAttribute('aria-label', hidden ? 'パスワードを隠す' : 'パスワードを見せる');
    });
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submit').disabled = true;
      const { error } = await client.auth.updateUser({ password: pw.value });
      if (error) {
        $('err').textContent = /different/i.test(error.message) ? '今のパスワードと違うものにしてください' : '変更できませんでした。少したってから、もう一度お試しください';
        $('submit').disabled = false;
        return;
      }
      await client.auth.signOut();
      show('done');
    });
  }
</script>
</body>
</html>
