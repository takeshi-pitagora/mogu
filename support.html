<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サポート | MogU</title>
<style>
  :root { --accent:#B5703A; --bg:#FBF7F0; --text:#3A342E; --sub:#8B8177; --border:#E5DCCE; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 24px 80px; }
  .logo { font-weight: 900; font-size: 24px; color: var(--accent); letter-spacing: .04em; margin-bottom: 20px; }
  h1 { font-size: 22px; margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; color: var(--accent); }
  .card p { font-size: 14px; margin: 0; }
  a { color: var(--accent); font-weight: 600; }
  .links { margin-top: 32px; font-size: 13px; }
  .links a { display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">MogU</div>
  <h1>サポート</h1>

  <div class="card">
    <h2>お問い合わせ</h2>
    <p>
      不具合のご報告やご質問は、以下のメールアドレスまでご連絡ください。<br>
      <a href="mailto:support@example.com">support@example.com</a>
    </p>
    <p style="color:var(--sub);font-size:11px;margin-top:8px;">
      （要差し替え：実際の連絡先メールアドレス）
    </p>
  </div>

  <div class="card">
    <h2>よくある質問</h2>
    <p>
      ・診断結果が反映されない場合は、アプリを再起動してからお試しください。<br>
      ・アカウントの削除は「マイページ」＞「アカウント削除」から行えます。
    </p>
  </div>

  <div class="links">
    <a href="./privacy-policy.html">プライバシーポリシー</a>
    <a href="./terms.html">利用規約</a>
  </div>
</div>
</body>
</html>
